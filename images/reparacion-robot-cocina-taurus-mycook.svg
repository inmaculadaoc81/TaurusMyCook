<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f2e6d3"/>
  <circle cx="960" cy="150" r="220" fill="#e9d8bd"/>
  <rect x="120" y="560" width="960" height="26" rx="13" fill="#d8c6a8"/>
  <!-- workbench -->
  <rect x="180" y="540" width="840" height="18" rx="9" fill="#c9b394"/>
  <!-- robot body (jar-shaped kitchen robot) -->
  <g>
    <rect x="470" y="300" width="260" height="250" rx="34" fill="#faf5ec" stroke="#2b2019" stroke-width="6"/>
    <rect x="500" y="330" width="200" height="120" rx="14" fill="#2b2019"/>
    <rect x="512" y="342" width="176" height="96" rx="8" fill="#3a2c22"/>
    <circle cx="600" cy="390" r="34" fill="#d97a4d" opacity="0.85"/>
    <rect x="500" y="470" width="200" height="18" rx="9" fill="#e6dbc7"/>
    <rect x="500" y="498" width="140" height="14" rx="7" fill="#e6dbc7"/>
    <!-- lid handle -->
    <rect x="565" y="270" width="70" height="34" rx="12" fill="#b5502e"/>
    <circle cx="600" cy="270" r="14" fill="#8a3c20"/>
  </g>
  <!-- steam -->
  <path d="M560 250 C550 235 562 222 552 205" fill="none" stroke="#d97a4d" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M600 240 C590 225 602 212 592 195" fill="none" stroke="#d97a4d" stroke-width="8" stroke-linecap="round"/>
  <path d="M640 250 C630 235 642 222 632 205" fill="none" stroke="#d97a4d" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- wrench / tool -->
  <g transform="translate(790,420) rotate(18)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#8a3c20"/>
    <circle cx="150" cy="13" r="30" fill="none" stroke="#8a3c20" stroke-width="22"/>
  </g>
  <!-- screwdriver -->
  <g transform="translate(330,470) rotate(-24)">
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#6b5c4d"/>
    <rect x="118" y="-6" width="34" height="28" rx="6" fill="#b5502e"/>
  </g>
  <!-- small gears -->
  <circle cx="330" cy="330" r="26" fill="none" stroke="#c9b394" stroke-width="10"/>
  <circle cx="880" cy="320" r="20" fill="none" stroke="#c9b394" stroke-width="8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f2e6d3"/>
  <circle cx="250" cy="640" r="240" fill="#e9d8bd"/>
  <!-- robot body front, opened panel -->
  <g>
    <rect x="440" y="260" width="320" height="320" rx="36" fill="#faf5ec" stroke="#2b2019" stroke-width="6"/>
    <rect x="470" y="300" width="120" height="90" rx="10" fill="#2b2019"/>
    <rect x="480" y="308" width="100" height="74" rx="6" fill="#3a2c22"/>
    <!-- circuit lines -->
    <path d="M610 320 h90 v40 h60" fill="none" stroke="#b5502e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="700" cy="360" r="8" fill="#b5502e"/>
    <circle cx="760" cy="360" r="8" fill="#d97a4d"/>
    <path d="M610 400 h60 v60 h50" fill="none" stroke="#d97a4d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="670" cy="460" r="8" fill="#d97a4d"/>
    <rect x="470" y="440" width="260" height="16" rx="8" fill="#e6dbc7"/>
    <rect x="470" y="470" width="180" height="12" rx="6" fill="#e6dbc7"/>
  </g>
  <!-- magnifier -->
  <g transform="translate(700,470)">
    <circle cx="0" cy="0" r="80" fill="#faf5ec" fill-opacity="0.35" stroke="#8a3c20" stroke-width="14"/>
    <line x1="55" y1="55" x2="130" y2="130" stroke="#8a3c20" stroke-width="20" stroke-linecap="round"/>
  </g>
  <!-- gauge -->
  <g transform="translate(950,260)">
    <circle cx="0" cy="0" r="60" fill="#faf5ec" stroke="#2b2019" stroke-width="6"/>
    <path d="M0 0 L28 -32" stroke="#b5502e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#2b2019"/>
  </g>
  <text x="600" y="700" font-family="Arial, sans-serif" font-size="34" fill="#6b5c4d" text-anchor="middle">20 € + IVA</text>
</svg>
